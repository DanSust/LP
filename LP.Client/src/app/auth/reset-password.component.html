<div class="auth-container">
  <div class="auth-tabs">
    <button class="tab-button active" type="button" disabled>Новый пароль</button>
  </div>

  <div class="form-container">
    <form class="form active" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="resetPassword">Новый пароль</label>
        <input type="password"
               id="resetPassword"
               formControlName="password"
               placeholder="Минимум 6 символов"
               [class.error]="form.get('password')?.invalid && form.get('password')?.touched">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <div class="error-message">
          Пароль должен содержать минимум 6 символов
        </div>
        }
      </div>

      <div class="form-group">
        <label for="resetConfirmPassword">Повторите пароль</label>
        <input type="password"
               id="resetConfirmPassword"
               formControlName="confirmPassword"
               placeholder="Повторите пароль"
               [class.error]="form.get('confirmPassword')?.touched && form.hasError('mismatch')">
        @if (form.get('confirmPassword')?.touched && form.hasError('mismatch')) {
        <div class="error-message">
          Пароли не совпадают
        </div>
        }
      </div>

      <button type="submit"
              class="auth-button"
              [disabled]="form.invalid || isLoading || !token || !email">
        @if (!isLoading) {
        <span>Сохранить пароль</span>
        } @else {
        <span class="spinner"></span>
        }
      </button>

      <div class="auth-link">
        <a routerLink="/auth">Вернуться ко входу</a>
      </div>
    </form>
  </div>
</div>
