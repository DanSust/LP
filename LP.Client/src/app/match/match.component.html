<app-splash-screen [visible]="showSplash && !matchProfileId" [inline]="true" text="Загружаем галерею" />

<!-- Взаимный лайк: тот же splash, что и в /vote -->
<app-splash-screen
  [visible]="matchProfileId !== null"
  [inline]="true"
  [showProgress]="false"
  text="Вы и"
  [linkText]="matchProfileName"
  [linkHref]="matchProfileHref"
  textAfterLink="понравились друг другу"
  actionText="Начать диалог"
  dismissText="Продолжить поиск"
  (action)="onStartMatchChat()"
  (dismiss)="onDismissMatch()" />

<div class="gallery-wrapper">
  <!-- 🔥 ВКЛАДКИ -->
  <div class="tabs-container">
    <button class="tab-button"
            [class.active]="activeTab === 'mutual'"
            (click)="setActiveTab('mutual')">
      Взаимные
    </button>
    <button class="tab-button"
            [class.active]="activeTab === 'likesMe'"
            (click)="setActiveTab('likesMe')">
      Я нравлюсь
    </button>
    <button class="tab-button"
            [class.active]="activeTab === 'viewed'"
            (click)="setActiveTab('viewed')">
      Гости
    </button>
    <!--<button class="tab-button"
            [class.active]="activeTab === 'iLike'"
            (click)="setActiveTab('iLike')">
      Я
    </button>-->
  </div>

  <!-- 🔥 ГАЛЕРЕЯ -->
  <div class="gallery-match-container" #galleryContainer>
    @for (image of filteredImages(); track image.userId) {
    <div class="gallery-item">
      @if (activeTab === 'likesMe') {
      <button type="button" class="like-button"
              [disabled]="likingUserId === image.userId"
              (click)="onLike(image, $event)">
        <mat-icon>favorite</mat-icon>        
      </button>
      }
      <mat-icon class="delete-icon"
                [class.photo-icon--light]="deleteIconClass(image) === 'photo-icon--light'"
                [class.photo-icon--dark]="deleteIconClass(image) === 'photo-icon--dark'"
                aria-hidden="false"
                aria-label="Удалить"
                fontIcon="delete"
                (click)="onDelete(image.userId); $event.stopPropagation()">
      </mat-icon>
      <div class="image-wrapper">
        <img [src]="getImageUrl(image.photoId)"
             [alt]="'Фото: ' + image.name"
             loading="lazy"
             decoding="async"
             (load)="onPhotoLoad($event, photoKey(image))"
             routerLink="/vote/{{image.userId}}" />
      </div>
      <div class="photo-info">
        <span class="photo-name">{{ image.name }}</span>
        <span class="photo-age">{{ image.age }} лет</span>
        @if (image.distance) {
        <span class="photo-distance">
          <mat-icon>place</mat-icon>
          {{ formatDistance(image.distance) }}
        </span>
        }
      </div>
    </div>
    }

    @if (isLoadingMore) {
    <div class="loading-more">
      <mat-spinner diameter="30"></mat-spinner>
      <span>Загрузка...</span>
    </div>
    }
  </div>

  <ng-template #loadingTemplate>
    <!--<div class="gallery-container">
      <div class="gallery-item loading"><div class="skeleton"></div></div>
      <div class="gallery-item loading"><div class="skeleton"></div></div>
      <div class="gallery-item loading"><div class="skeleton"></div></div>
      <div class="gallery-item loading"><div class="skeleton"></div></div>
    </div>-->
  </ng-template>
</div>
