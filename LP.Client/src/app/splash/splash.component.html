<div
  class="splash"
  [class.splash--inline]="inline()"
  [class.is-hidden]="!visible()"
  [attr.role]="actionText() ? 'dialog' : 'status'"
  [attr.aria-modal]="actionText() ? 'true' : null"
  [attr.aria-live]="actionText() ? null : 'polite'"
  [attr.aria-busy]="visible()"
  [attr.aria-label]="text()"
>
  <div class="splash__aurora splash__aurora--pink" aria-hidden="true"></div>
  <div class="splash__aurora splash__aurora--blue" aria-hidden="true"></div>
  <div class="splash__grid" aria-hidden="true"></div>

  <div class="splash__content">
    <div class="hearts-container" aria-hidden="true">
      <!-- Красное сердце -->
      <svg class="heart heart-left" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>

      <!-- Синее сердце -->
      <svg class="heart heart-right" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>

      <!-- Кардиограмма -->
      <svg class="ecg-container" viewBox="0 0 240 70">
        <g opacity="0.2">
          <line x1="0" y1="35" x2="240" y2="35" stroke="#fff" stroke-width="0.5" stroke-dasharray="2,2" />
          <line x1="0" y1="20" x2="240" y2="20" stroke="#fff" stroke-width="0.5" stroke-dasharray="2,2" />
          <line x1="0" y1="50" x2="240" y2="50" stroke="#fff" stroke-width="0.5" stroke-dasharray="2,2" />
        </g>
        <path class="ecg-line" d="M0,35 L15,35 L20,10 L25,50 L30,10 L35,35 L120,35 L125,15 L130,45 L135,15 L140,35 L240,35" />
      </svg>
    </div>

    <div class="splash__logo" aria-label="made4love">
      <span class="splash__logo-made">made</span>
      <span class="splash__logo-four">4</span>
      <span class="splash__logo-love">love</span>
    </div>

    <p class="splash__tagline">знакомства со смыслом</p>

    @if (showProgress()) {
      <div
        class="splash__progress"
        [class.is-indeterminate]="progress() === null"
        aria-hidden="true"
      >
        <div
          class="splash__progress-fill"
          [style.width.%]="progress() ?? 100"
        ></div>
      </div>
    }

    <p class="splash__text">
      {{ text() }}@if (!actionText()) {
      <span class="splash__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
      }
    </p>

    @if (actionText()) {
      <button type="button" class="splash__action" (click)="action.emit()">
        {{ actionText() }}
      </button>
    }

    @if (dismissText()) {
      <button type="button" class="splash__dismiss" (click)="dismiss.emit()">
        {{ dismissText() }}
      </button>
    }
  </div>
</div>
