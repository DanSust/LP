<div class="avatar-wrapper">
  <div class="avatar-container">
    <img [src]="avatarUrl()"
         [alt]="name()"
         decoding="async"
         class="chat-avatar"
         (error)="onImageError()">
    <div class="status-indicator"
         [class.online]="isOnline()"
         [attr.title]="isOnline() ? 'Онлайн' : 'Офлайн'"></div>
  </div>
  @if (showName()) {
  <div class="chat-name">{{ name() }}</div>
  }
</div>
